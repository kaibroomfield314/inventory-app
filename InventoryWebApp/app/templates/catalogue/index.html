{% extends "base.html" %}
{% block content %}
<form method="get" id="search-form">
  <input name="q" id="search" value="{{ q }}" placeholder="Search products">
  <select name="category" id="category">
    <option value="">All categories</option>
    {% for c in categories %}<option value="{{ c.id }}" {% if c.id == selected %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
  </select>
  <button type="submit">Search</button>
</form>
<div class="grid">
  {% for p in products %}
  <div class="card product">
    <h3><a href="{{ url_for('catalogue.detail', product_id=p.id) }}">{{ p.name }}</a></h3>
    <p>${{ '%.2f'|format(p.price) }}</p>
    <p>{{ 'In stock (%d)'|format(p.stock) if p.in_stock else 'Out of stock' }}</p>
  </div>
  {% else %}
  <p id="no-results">No products found.</p>
  {% endfor %}
</div>
{% endblock %}
