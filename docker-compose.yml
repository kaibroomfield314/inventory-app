services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: sh -c "flask db upgrade && flask seed && flask run --host 0.0.0.0 --port 8000 --debug"
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@db:5432/inventory
      APP_ENV: development
      SECRET_KEY: dev-only
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
